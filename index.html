  <!-- SCRIPT PRINCIPAL CON FIREBASE -->
  <script type="module">
    // 1. IMPORTAR SDKs DE FIREBASE v11
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 2. CONFIGURACIÓN EXACTA
    const firebaseConfig = {
      apiKey: "AIzaSyCC84-VtL9XAq-Zzi2eWRaQpvpJOBPlffw",
      authDomain: "cuentaspersonales-95a75.firebaseapp.com",
      projectId: "cuentaspersonales-95a75",
      storageBucket: "cuentaspersonales-95a75.firebasestorage.app",
      messagingSenderId: "1080262607029",
      appId: "1:1080262607029:web:8cb120ea1bbc8844753efc",
      measurementId: "G-6T5RWEP3Y1"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const APP_ID = "cuentas-personales-app";

    // 3. ESTADO GLOBAL
    let movements = [];
    let currentDate = new Date();
    let selectedDateStr = null;
    let editingId = null; 
    let formType = 'gasto';
    let searchYear = new Date().getFullYear();
    let searchMonth = new Date().getMonth().toString(); // Selecciona el mes actual por defecto
    let searchQuery = '';

    const CATEGORIES = {
      ingreso: { label: 'Ingreso', emoji: '📈', color: '#10b981', bgClass: 'bg-emerald-500/10', textClass: 'text-emerald-400', borderClass: 'border-emerald-500/50' },
      gasto: { label: 'Gasto', emoji: '📉', color: '#f43f5e', bgClass: 'bg-rose-500/10', textClass: 'text-rose-400', borderClass: 'border-rose-500/50' },
      ahorro: { label: 'Ahorro', emoji: '💰', color: '#3b82f6', bgClass: 'bg-blue-500/10', textClass: 'text-blue-400', borderClass: 'border-blue-500/50' }
    };

    // Formateador de moneda
    const formatCurrency = (amount) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);

    // --- Llenar selectores de años al inicio ---
    const yearSelect = document.getElementById('year-select');
    const selectYearBottom = document.getElementById('search-year');
    const baseYear = new Date().getFullYear();
    
    // Para el calendario
    for (let y = 2020; y <= baseYear + 5; y++) {
      yearSelect.innerHTML += `<option value="${y}" class="bg-gray-800 text-white">${y}</option>`;
    }
    // Para el filtro histórico
    for (let i = 0; i < 5; i++) {
      const y = baseYear - 2 + i;
      selectYearBottom.innerHTML += `<option value="${y}" ${y === searchYear ? 'selected' : ''}>${y}</option>`;
    }

    // --- AUTENTICACIÓN INVISIBLE ---
    async function initInvisibleAuth() {
      try {
        await signInAnonymously(auth);
      } catch (error) {
        console.error("Error al conectar de forma invisible:", error);
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loadMovements(); // Cuando hay conexión, cargamos los datos
      }
    });

    initInvisibleAuth();

    // 5. CARGAR DATOS DESDE FIRESTORE
    function loadMovements() {
      const q = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'movements'));
      
      onSnapshot(q, (snapshot) => {
        movements = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        // Ordenar descendentemente
        movements.sort((a, b) => new Date(b.date) - new Date(a.date));
        renderApp();
      }, (error) => {
        console.error("Error al cargar datos:", error);
      });
    }

    // 6. RENDERIZADO PRINCIPAL
    function renderApp() {
      renderCalendar();
      renderMonthSummary();
      renderYearSummary();
      renderTable();
      lucide.createIcons(); // Recargar iconos tras manipular el DOM
    }

    // --- RENDERIZADO DEL CALENDARIO ---
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const today = new Date();
      
      // Actualizar selectores de mes y año directamente
      document.getElementById('month-select').value = month;
      document.getElementById('year-select').value = year;

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      // Lógica para que la semana empiece en Lunes
      let firstDayIndex = new Date(year, month, 1).getDay();
      firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1; 
      
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      // Cajas vacías
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'h-16 md:h-28 rounded-xl bg-gray-800/20 border border-transparent';
        grid.appendChild(emptyDiv);
      }

      // Días del mes (con proporciones más estéticas y compactas en celulares)
      for (let day = 1; day <= daysInMonth; day++) {
        const formattedMonth = String(month + 1).padStart(2, '0');
        const formattedDay = String(day).padStart(2, '0');
        const dateStr = `${year}-${formattedMonth}-${formattedDay}`;
        
        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
        const dayMovements = movements.filter(m => m.date === dateStr);
        
        const btn = document.createElement('button');
        btn.onclick = () => openModal(dateStr);
        
        // Reducimos la altura a h-16 en móvil para que se vea más estilizado
        let baseClass = `relative h-16 md:h-28 rounded-xl border flex flex-col justify-between items-center p-1 md:p-2 transition-all hover:bg-gray-700/50 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer `;
        if (isToday) {
          baseClass += 'bg-blue-600/20 border-blue-500/50 text-blue-400 font-bold';
        } else {
          baseClass += 'bg-gray-800/40 border-gray-700/50 text-gray-300 hover:border-gray-500';
        }
        btn.className = baseClass;

        // Tamaño del número adaptado (text-sm en móvil, text-lg en desktop)
        let innerHTML = `<span class="text-sm md:text-xl font-medium w-full text-center mt-0.5 md:mt-1">${day}</span>`;

        if (dayMovements.length > 0) {
          // Adaptamos ligeramente el tamaño de los emojis para que queden perfectamente alineados abajo
          let emojisHtml = dayMovements.slice(0, 3).map(m => `<span class="text-[10px] md:text-sm leading-none" title="${CATEGORIES[m.type].label}: ${formatCurrency(m.amount)}">${CATEGORIES[m.type].emoji}</span>`).join('');
          if (dayMovements.length > 3) emojisHtml += `<span class="text-[9px] md:text-[10px] text-gray-400 font-bold self-center leading-none ml-0.5">+${dayMovements.length - 3}</span>`;
          
          innerHTML += `<div class="mt-auto flex flex-wrap justify-center gap-0.5 w-full px-0.5 pb-0.5">${emojisHtml}</div>`;
        }
        
        btn.innerHTML = innerHTML;
        grid.appendChild(btn);
      }
    }

    // --- RENDERIZADO DEL RESUMEN MENSUAL Y PORCENTAJES ---
    function renderMonthSummary() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      const monthMovements = movements.filter(m => {
        const d = new Date(m.date + 'T00:00:00');
        return d.getFullYear() === year && d.getMonth() === month;
      });

      let totals = { ingreso: 0, gasto: 0, ahorro: 0, total: 0 };
      monthMovements.forEach(m => {
        totals[m.type] += m.amount;
        totals.total += m.amount; // Este es el volumen total de movimientos
      });

      // Actualizar Gráfica
      const donutEl = document.getElementById('donut-chart');
      if (totals.total === 0) {
        donutEl.style.background = 'transparent';
        donutEl.classList.remove('border-transparent');
        donutEl.classList.add('border-gray-700');
      } else {
        const pIngreso = (totals.ingreso / totals.total) * 100;
        const pGasto = (totals.gasto / totals.total) * 100;
        const conicGradient = `conic-gradient(
          ${CATEGORIES.ingreso.color} 0% ${pIngreso}%,
          ${CATEGORIES.gasto.color} ${pIngreso}% ${pIngreso + pGasto}%,
          ${CATEGORIES.ahorro.color} ${pIngreso + pGasto}% 100%
        )`;
        donutEl.style.background = conicGradient;
        donutEl.classList.add('border-transparent');
        donutEl.classList.remove('border-gray-700');
      }

      document.getElementById('donut-total').textContent = formatCurrency(totals.ingreso - totals.gasto);

      // Actualizar Lista de Totales con PORCENTAJES AÑADIDOS
      const listContainer = document.getElementById('month-summary-list');
      listContainer.innerHTML = '';
      
      Object.keys(CATEGORIES).forEach(type => {
        const cat = CATEGORIES[type];
        const percentage = totals.total > 0 ? ((totals[type] / totals.total) * 100).toFixed(1) : '0.0';
        
        listContainer.innerHTML += `
          <div class="flex items-center justify-between p-3 rounded-xl border ${cat.borderClass} ${cat.bgClass}">
            <div class="flex items-center gap-3">
              <span class="text-xl">${cat.emoji}</span>
              <span class="font-medium text-gray-200">
                ${cat.label} 
                <span class="text-xs text-gray-400 font-normal ml-1">(${percentage}%)</span>
              </span>
            </div>
            <span class="font-bold ${cat.textClass}">${formatCurrency(totals[type])}</span>
          </div>
        `;
      });
    }

    // --- RENDERIZADO DEL RESUMEN ANUAL Y TABLA ---
    function renderYearSummary() {
      const yearMovements = movements.filter(m => {
        const d = new Date(m.date + 'T00:00:00');
        const matchYear = d.getFullYear() === searchYear;
        const matchMonth = searchMonth === 'all' || d.getMonth() === parseInt(searchMonth);
        return matchYear && matchMonth;
      });

      let totals = { ingreso: 0, gasto: 0, ahorro: 0 };
      yearMovements.forEach(m => {
        totals[m.type] += m.amount;
      });

      const gridContainer = document.getElementById('year-summary-grid');
      gridContainer.innerHTML = '';
      
      const labelTime = searchMonth === 'all' ? 'Anual' : 'del Mes';

      Object.keys(CATEGORIES).forEach(type => {
        const cat = CATEGORIES[type];
        gridContainer.innerHTML += `
          <div class="bg-gray-900/50 rounded-xl p-4 border border-gray-700 flex flex-col items-center text-center">
            <span class="text-sm text-gray-400 mb-1">${cat.emoji} ${cat.label} ${labelTime}</span>
            <span class="text-xl font-bold ${cat.textClass}">${formatCurrency(totals[type])}</span>
          </div>
        `;
      });
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      const lowerQuery = searchQuery.toLowerCase();
      const filtered = movements.filter(m => {
        const d = new Date(m.date + 'T00:00:00');
        const matchYear = d.getFullYear() === searchYear;
        const matchMonth = searchMonth === 'all' || d.getMonth() === parseInt(searchMonth);
        const matchQuery = m.concept.toLowerCase().includes(lowerQuery) || 
                           m.amount.toString().includes(lowerQuery) ||
                           CATEGORIES[m.type].label.toLowerCase().includes(lowerQuery);
        return matchYear && matchMonth && matchQuery;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-500">No hay movimientos registrados.</td></tr>`;
        return;
      }

      filtered.forEach(m => {
        const cat = CATEGORIES[m.type];
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-700/20 transition-colors border-b border-gray-700/50 last:border-0';
        tr.innerHTML = `
          <td class="py-3 px-4">${m.date}</td>
          <td class="py-3 px-4">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border ${cat.bgClass} ${cat.textClass} ${cat.borderClass}">
              ${cat.emoji} ${cat.label}
            </span>
          </td>
          <td class="py-3 px-4 text-gray-300">${m.concept}</td>
          <td class="py-3 px-4 text-right font-medium ${cat.textClass}">
            ${m.type === 'gasto' ? '-' : '+'}${formatCurrency(m.amount)}
          </td>
          <td class="py-3 px-4 text-center">
            <div class="flex items-center justify-center gap-2">
              <button data-id="${m.id}" class="btn-edit p-1.5 text-gray-500 hover:text-blue-400 rounded-md hover:bg-blue-500/10 transition-colors" title="Editar">
                <i data-lucide="edit-3" class="w-4 h-4 pointer-events-none"></i>
              </button>
              <button data-id="${m.id}" class="btn-delete p-1.5 text-gray-500 hover:text-rose-500 rounded-md hover:bg-rose-500/10 transition-colors" title="Eliminar">
                <i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // --- MANEJO DE EVENTOS DE INTERFAZ ---
    
    // Toggle para Modo Claro / Oscuro
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      // Cambiar ícono según el tema actual
      themeIcon.setAttribute('data-lucide', isLight ? 'moon' : 'sun');
      lucide.createIcons();
    });

    // Dropdown Exportar
    const btnExportMenu = document.getElementById('btn-export-menu');
    const exportDropdown = document.getElementById('export-dropdown');
    
    btnExportMenu.addEventListener('click', () => {
      exportDropdown.classList.toggle('hidden');
    });
    
    // Cerrar dropdown al hacer clic fuera
    document.addEventListener('click', (e) => {
      if (!btnExportMenu.contains(e.target) && !exportDropdown.contains(e.target)) {
        exportDropdown.classList.add('hidden');
      }
    });

    // Lógica de Exportación
    function getMonthExportData() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthName = document.getElementById('month-select').options[month].text;
      
      const monthMovements = movements.filter(m => {
        const d = new Date(m.date + 'T00:00:00');
        return d.getFullYear() === year && d.getMonth() === month;
      });
      
      return { year, monthName, monthMovements };
    }

    document.getElementById('btn-export-pdf').addEventListener('click', () => {
      exportDropdown.classList.add('hidden');
      const { year, monthName, monthMovements } = getMonthExportData();
      
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      doc.setFontSize(18);
      doc.text(`Resumen Mensual - ${monthName} ${year}`, 14, 22);
      
      const tableData = monthMovements.map(m => [
        m.date,
        CATEGORIES[m.type].label,
        m.concept,
        (m.type === 'gasto' ? '-' : '+') + formatCurrency(m.amount)
      ]);
      
      let totalIngresos = 0, totalGastos = 0, totalAhorros = 0;
      monthMovements.forEach(m => {
        if(m.type === 'ingreso') totalIngresos += m.amount;
        if(m.type === 'gasto') totalGastos += m.amount;
        if(m.type === 'ahorro') totalAhorros += m.amount;
      });
      
      doc.autoTable({
        startY: 30,
        head: [['Fecha', 'Tipo', 'Concepto', 'Monto']],
        body: tableData,
        foot: [
          ['', '', 'Total Ingresos:', formatCurrency(totalIngresos)],
          ['', '', 'Total Gastos:', formatCurrency(totalGastos)],
          ['', '', 'Total Ahorros:', formatCurrency(totalAhorros)],
          ['', '', 'Balance Final:', formatCurrency(totalIngresos - totalGastos)]
        ],
        theme: 'grid',
        headStyles: { fillColor: [59, 130, 246] },
        footStyles: { fillColor: [243, 244, 246], textColor: [15, 23, 42], fontStyle: 'bold' }
      });
      
      doc.save(`Resumen_${monthName}_${year}.pdf`);
    });

    document.getElementById('btn-export-excel').addEventListener('click', () => {
      exportDropdown.classList.add('hidden');
      const { year, monthName, monthMovements } = getMonthExportData();
      
      const wsData = [
        ['Fecha', 'Tipo', 'Concepto', 'Monto']
      ];
      
      let totalIngresos = 0, totalGastos = 0, totalAhorros = 0;
      
      monthMovements.forEach(m => {
        wsData.push([m.date, CATEGORIES[m.type].label, m.concept, (m.type === 'gasto' ? -m.amount : m.amount)]);
        if(m.type === 'ingreso') totalIngresos += m.amount;
        if(m.type === 'gasto') totalGastos += m.amount;
        if(m.type === 'ahorro') totalAhorros += m.amount;
      });
      
      wsData.push([]);
      wsData.push(['', '', 'Total Ingresos:', totalIngresos]);
      wsData.push(['', '', 'Total Gastos:', -totalGastos]);
      wsData.push(['', '', 'Total Ahorros:', totalAhorros]);
      wsData.push(['', '', 'Balance Final:', totalIngresos - totalGastos]);
      
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Resumen");
      
      XLSX.writeFile(wb, `Resumen_${monthName}_${year}.xlsx`);
    });

    // Lógica para Imprimir Pantalla
    document.getElementById('btn-print').addEventListener('click', () => {
      window.print();
    });
    
    // Botón Hoy
    document.getElementById('btn-today').addEventListener('click', () => {
      currentDate = new Date();
      renderApp();
    });

    // Selectores de Mes y Año
    document.getElementById('month-select').addEventListener('change', (e) => {
      currentDate = new Date(currentDate.getFullYear(), parseInt(e.target.value), 1);
      renderApp();
    });

    document.getElementById('year-select').addEventListener('change', (e) => {
      currentDate = new Date(parseInt(e.target.value), currentDate.getMonth(), 1);
      renderApp();
    });

    // Navegación de Meses con las flechitas
    document.getElementById('btn-prev-month').addEventListener('click', () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
      renderApp();
    });
    document.getElementById('btn-next-month').addEventListener('click', () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
      renderApp();
    });

    selectYearBottom.addEventListener('change', (e) => {
      searchYear = Number(e.target.value);
      renderYearSummary();
      renderTable();
      lucide.createIcons();
    });

    // Selector de Mes Histórico
    const selectMonthBottom = document.getElementById('search-month');
    selectMonthBottom.value = searchMonth; // Asignar mes por defecto en la UI
    
    selectMonthBottom.addEventListener('change', (e) => {
      searchMonth = e.target.value;
      renderYearSummary();
      renderTable();
      lucide.createIcons();
    });

    // Lógica del Acordeón para Consultas Históricas
    const toggleHistoryBtn = document.getElementById('toggle-history-btn');
    const historyContent = document.getElementById('history-content');
    const historyChevron = document.getElementById('history-chevron');

    toggleHistoryBtn.addEventListener('click', () => {
      historyContent.classList.toggle('hidden');
      historyChevron.classList.toggle('rotate-180');
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderTable();
      lucide.createIcons();
    });

    // Lógica del Modal
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modal-content');
    
    function renderTypeSelectors() {
      const container = document.getElementById('type-selectors');
      container.innerHTML = '';
      Object.keys(CATEGORIES).forEach(t => {
        const cat = CATEGORIES[t];
        const isSelected = formType === t;
        const btnClass = isSelected 
          ? `${cat.borderClass} ${cat.bgClass} ${cat.textClass}` 
          : `border-gray-700 bg-gray-900/50 text-gray-400 hover:bg-gray-700`;
        
        container.innerHTML += `
          <button type="button" onclick="window.selectType('${t}')" class="py-2 px-1 rounded-xl border text-sm font-medium transition-all flex flex-col items-center gap-1 cursor-pointer ${btnClass}">
            <span class="text-lg">${cat.emoji}</span>
            ${cat.label}
          </button>
        `;
      });
    }

    window.selectType = function(t) {
      formType = t;
      renderTypeSelectors();
    }

    window.openModal = function(dateStr, existingMovement = null) {
      selectedDateStr = dateStr;
      document.getElementById('modal-date-label').textContent = dateStr;
      
      if (existingMovement) {
        editingId = existingMovement.id;
        document.getElementById('modal-title-text').textContent = 'Editar Movimiento';
        document.getElementById('form-amount').value = existingMovement.amount;
        document.getElementById('form-concept').value = existingMovement.concept;
        formType = existingMovement.type;
        document.getElementById('btn-save-movement').textContent = 'Actualizar Movimiento';
      } else {
        editingId = null;
        document.getElementById('modal-title-text').textContent = 'Añadir Movimiento';
        document.getElementById('form-amount').value = '';
        document.getElementById('form-concept').value = '';
        formType = 'gasto';
        document.getElementById('btn-save-movement').textContent = 'Guardar Movimiento';
      }

      renderTypeSelectors();
      
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalContent.classList.remove('scale-95');
      }, 10);
    }

    function closeModal() {
      modal.classList.add('opacity-0');
      modalContent.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    document.getElementById('btn-close-modal').addEventListener('click', closeModal);

    // Guardar o Actualizar en Firestore
    document.getElementById('movement-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedDateStr) return;

      const amount = parseFloat(document.getElementById('form-amount').value);
      const concept = document.getElementById('form-concept').value;

      const movementData = {
        date: selectedDateStr,
        type: formType,
        amount: amount,
        concept: concept,
        timestamp: new Date().toISOString()
      };

      try {
        if (editingId) {
          // Actualizar documento existente
          await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'movements', editingId), movementData);
        } else {
          // Crear nuevo documento
          await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'movements'), movementData);
        }
        closeModal();
      } catch (error) {
        console.error("Error al guardar/actualizar:", error);
      }
    });

    // Acciones de la Tabla (Editar y Eliminar)
    document.getElementById('table-body').addEventListener('click', async (e) => {
      const btnDelete = e.target.closest('.btn-delete');
      const btnEdit = e.target.closest('.btn-edit');

      // Acción de Eliminar
      if (btnDelete) {
        const id = btnDelete.getAttribute('data-id');
        try {
          await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'movements', id));
        } catch (error) {
          console.error("Error al borrar:", error);
        }
      }

      // Acción de Editar
      if (btnEdit) {
        const id = btnEdit.getAttribute('data-id');
        const movementToEdit = movements.find(m => m.id === id);
        if (movementToEdit) {
          window.openModal(movementToEdit.date, movementToEdit);
        }
      }
    });

    // Inicializar Iconos y Render Base
    lucide.createIcons();
    renderApp();

    // --- LÓGICA DE INICIO DE SESIÓN ---
    const loginScreen = document.getElementById('login-screen');
    const loginForm = document.getElementById('login-form');
    const appContainer = document.getElementById('app-container');
    const loginError = document.getElementById('login-error');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const pwd = document.getElementById('login-password').value;
      
      if (pwd === '2527') {
        // Transición de desvanecimiento
        loginScreen.style.opacity = '0';
        setTimeout(() => {
          loginScreen.classList.add('hidden');
          appContainer.classList.remove('hidden');
        }, 500);
      } else {
        // Mostrar error y reiniciar input
        loginError.classList.remove('hidden');
        document.getElementById('login-password').value = '';
        document.getElementById('login-password').focus();
      }
    });

  </script>
</body>
</html>
